<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="js/access-gate.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>Sign in · Vitarus</title>
<link rel="stylesheet" href="css/shared.css?v=2">
<link rel="stylesheet" href="css/redesign.css?v=3">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
  .login-wrap { width: 100%; max-width: 380px; }
  body .login-layout { grid-template-columns: minmax(0, 1.2fr) 440px; max-width: clamp(1120px, 88vw, 1700px); gap: 64px; }
  .login-brand { display: none; }
  .login-wordmark-panel {
    position: relative; isolation: isolate; text-align: center; color: var(--brand-navy);
    padding: 16px 22px 34px;
  }
  .login-wordmark-panel .login-art {
    width: min(420px, 100%); min-height: 300px; margin: 0 auto 10px;
  }
  .login-wordmark-panel .login-art img {
    width: 82%;
  }
  .login-wordmark {
    display: flex; align-items: center; justify-content: center; gap: clamp(8px, 1.4vw, 18px);
    font-size: 82px; font-weight: 800; line-height: .82;
    letter-spacing: 0; color: var(--brand-navy);
  }
  .login-wordmark .brand-a {
    position: relative; color: var(--brand-teal); display: inline-block;
  }
  .login-wordmark .brand-a::after {
    content: "+"; position: absolute; left: 50%; top: 62%; transform: translate(-50%, -50%);
    color: var(--brand-teal); font-size: .36em; font-weight: 900; letter-spacing: 0;
  }
  .login-wrap { position: relative; isolation: isolate; }
  .login-wrap::before {
    content: ""; position: absolute; z-index: -1; inset: -54px -42px;
    border: 1px dashed rgba(21,149,141,.2); border-radius: 50%;
    animation: heroOrbit 24s linear infinite reverse;
  }
  .login-wrap::after {
    content: ""; position: absolute; z-index: -1; left: -34px; right: -34px; top: 50%;
    height: 1px; background: linear-gradient(90deg, transparent, rgba(21,149,141,.8), transparent);
    box-shadow: 0 0 12px rgba(21,149,141,.32);
  }
  .login-wrap > .card {
    position: relative; overflow: hidden;
    background: rgba(255,255,255,.88) !important;
    border: 1px solid rgba(21,149,141,.22) !important;
    box-shadow: 0 18px 40px rgba(12,53,82,.12), 0 0 0 8px rgba(21,149,141,.035);
    backdrop-filter: blur(16px);
  }
  .login-wrap > .card::before {
    content: ""; position: absolute; inset: 0 0 auto; height: 4px;
    background: linear-gradient(90deg, var(--mod-cardiac), var(--mod-ultrasound), var(--brand-teal), var(--mod-gait));
  }
  .login-wrap > .card::after {
    content: ""; position: absolute; right: -58px; top: -58px; width: 160px; height: 160px;
    border: 1px dashed rgba(21,149,141,.22); border-radius: 50%;
    pointer-events: none; animation: heroOrbit 18s linear infinite;
  }
  @media (max-width: 1040px) {
    .login-wordmark-panel .login-art { width: min(340px, 100%); min-height: 245px; }
    .login-wordmark { font-size: 62px; }
  }
  @media (max-width: 820px) {
    body .login-layout { grid-template-columns: 1fr; gap: 26px; max-width: 430px; }
    .login-wordmark-panel { order: -1; }
    .login-wordmark-panel .login-art { width: min(230px, 100%); min-height: 170px; }
    .login-wordmark { font-size: 42px; letter-spacing: 0; gap: 7px; }
    .login-wrap::before, .login-wrap::after, .login-wrap > .card::after { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .login-wordmark-panel .login-art::before, .login-wrap::before, .login-wrap > .card::after { animation: none !important; }
  }
  .login-tabs { display: flex; margin-bottom: 16px; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
  .login-tab { flex: 1; text-align: center; padding: 9px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--text-muted); background: var(--surface); }
  .login-tab.active { color: #fff; background: var(--blue); }
  .login-form { display: none; flex-direction: column; gap: 12px; }
  .login-form.active { display: flex; }
  .login-forgot-row { text-align: right; margin-top: -8px; }
  .login-forgot-row a, .login-back-link { font-size: 12px; color: var(--blue-light); font-weight: 600; }
  .login-back-link { display: inline-block; margin-bottom: 2px; }
  .login-alert {
    display: none; align-items: flex-start; gap: 8px; padding: 10px 12px;
    border-radius: var(--radius-sm); font-size: 12.5px; line-height: 1.5;
  }
  .login-alert.show { display: flex; }
  .login-alert.error { background: rgba(201,72,77,.1); border: 1px solid rgba(201,72,77,.35); color: var(--red); }
  .login-alert.success { background: rgba(21,149,141,.1); border: 1px solid rgba(21,149,141,.35); color: var(--brand-teal); }
  .login-alert .la-icon { flex-shrink: 0; }
  .login-alert a { color: inherit; font-weight: 700; text-decoration: underline; }
  @keyframes loginShake {
    10%, 90% { transform: translateX(-1px); }
    20%, 80% { transform: translateX(2px); }
    30%, 50%, 70% { transform: translateX(-4px); }
    40%, 60% { transform: translateX(4px); }
  }
  .login-alert.error.show { animation: loginShake .4s; }
  .login-hint {
    margin-top: 20px; font-size: 11.5px; color: var(--text-dim); line-height: 1.6;
    border-top: 1px solid var(--border); padding-top: 14px;
  }
  .login-hint code { color: var(--blue-light); font-family: var(--font-mono); }
</style>
<link rel="stylesheet" href="css/redesign.css?v=3">
<link rel="stylesheet" href="css/experience.css?v=1">
</head>
<body>

<div class="login-layout">
  <div class="login-wordmark-panel" aria-label="Vitarus">
    <div class="login-art" aria-hidden="true">
      <img src="assets/brand/logo-icon.png" alt="">
      <div class="evidence-callout one">VET_REVIEW · VERIFIED</div>
      <div class="evidence-callout two">PATIENT_DATA · SECURE</div>
    </div>
    <div class="login-wordmark" aria-hidden="true">
      <span>VIT</span><span class="brand-a">A</span><span>RUS</span>
    </div>
  </div>
  <div class="login-wrap">
  <div class="card">
    <div class="card-body">
      <div class="login-tabs">
        <div class="login-tab active" data-tab="signin">Sign in</div>
        <div class="login-tab" data-tab="register">Register (pet owner)</div>
      </div>

      <form class="login-form active" id="form-signin">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="signin-email" required autocomplete="username">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="signin-password" required autocomplete="current-password">
        </div>
        <div class="login-forgot-row"><a href="#" id="link-forgot-password">Forgot password?</a></div>
        <div class="login-alert" id="signin-error"></div>
        <button type="submit" class="btn btn-primary btn-full">Sign in</button>
      </form>

      <form class="login-form" id="form-register">
        <div class="form-group">
          <label>Your name</label>
          <input type="text" id="register-name" required autocomplete="name">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="register-email" required autocomplete="username">
        </div>
        <div class="form-group">
          <label>Password (min. 8 characters)</label>
          <input type="password" id="register-password" required minlength="8" autocomplete="new-password">
        </div>
        <div class="login-alert" id="register-error"></div>
        <button type="submit" class="btn btn-primary btn-full">Create account</button>
      </form>

      <form class="login-form" id="form-forgot">
        <a href="#" id="link-back-to-signin" class="login-back-link">← Back to sign in</a>
        <p class="text-muted" style="font-size:12.5px;margin:0;">Enter your account email and we'll generate a password reset link.</p>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="forgot-email" required autocomplete="username">
        </div>
        <div class="login-alert" id="forgot-message"></div>
        <button type="submit" class="btn btn-primary btn-full" id="btn-forgot-submit">Send reset link</button>
      </form>
    </div>
  </div>
</div>
</div>

<script>
function roleHome(role) {
  return { staff: '/staff/index.html', vet: '/vet/index.html', owner: '/owner/index.html', admin: '/admin/index.html', super_admin: '/admin/index.html' }[role] || '/';
}

// Already signed in? Skip straight to the right portal.
fetch('/api/auth/me', { credentials: 'same-origin' })
  .then(r => r.ok ? r.json() : null)
  .then(user => { if (user) location.href = roleHome(user.role); })
  .catch(() => {});

function showAlert(el, message, type) {
  el.classList.remove('show');
  void el.offsetWidth; // reflow, so the shake animation restarts on repeat errors
  el.className = 'login-alert' + (type ? ' ' + type : '');
  el.innerHTML = message ? `<span class="la-icon">${type === 'success' ? '✓' : '⚠️'}</span><span>${message}</span>` : '';
  if (message) el.classList.add('show');
}

function showView(formId, { tabsVisible } = { tabsVisible: true }) {
  document.querySelectorAll('.login-form').forEach(f => f.classList.remove('active'));
  document.querySelectorAll('.login-tab').forEach(t => t.classList.remove('active'));
  document.getElementById(formId).classList.add('active');
  document.querySelector('.login-tabs').style.display = tabsVisible ? '' : 'none';
  if (tabsVisible) document.querySelector(`.login-tab[data-tab="${formId.replace('form-', '')}"]`).classList.add('active');
}

document.querySelectorAll('.login-tab').forEach(tab => {
  tab.addEventListener('click', () => showView('form-' + tab.dataset.tab));
});

document.getElementById('link-forgot-password').addEventListener('click', (e) => {
  e.preventDefault();
  showAlert(document.getElementById('forgot-message'), '', null);
  showView('form-forgot', { tabsVisible: false });
});

document.getElementById('link-back-to-signin').addEventListener('click', (e) => {
  e.preventDefault();
  showView('form-signin');
});

document.getElementById('form-signin').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('signin-error');
  showAlert(errEl, '', null);
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin',
      body: JSON.stringify({
        email: document.getElementById('signin-email').value.trim(),
        password: document.getElementById('signin-password').value
      })
    });
    const data = await res.json();
    if (!res.ok) {
      showAlert(errEl, (data.error || 'Sign-in failed') + ' — check your email and password and try again.', 'error');
      document.getElementById('signin-password').value = '';
      document.getElementById('signin-password').focus();
      return;
    }
    location.href = roleHome(data.role);
  } catch {
    showAlert(errEl, 'Could not reach the server — is the backend running?', 'error');
  }
});

document.getElementById('form-register').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('register-error');
  showAlert(errEl, '', null);
  try {
    const res = await fetch('/api/auth/register', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin',
      body: JSON.stringify({
        name: document.getElementById('register-name').value.trim(),
        email: document.getElementById('register-email').value.trim(),
        password: document.getElementById('register-password').value
      })
    });
    const data = await res.json();
    if (!res.ok) { showAlert(errEl, data.error || 'Registration failed', 'error'); return; }
    location.href = roleHome(data.role);
  } catch {
    showAlert(errEl, 'Could not reach the server — is the backend running?', 'error');
  }
});

document.getElementById('form-forgot').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msgEl = document.getElementById('forgot-message');
  const btn = document.getElementById('btn-forgot-submit');
  showAlert(msgEl, '', null);
  btn.disabled = true;
  btn.textContent = 'Sending…';
  try {
    const res = await fetch('/api/auth/forgot-password', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin',
      body: JSON.stringify({ email: document.getElementById('forgot-email').value.trim() })
    });
    const data = await res.json();
    if (!res.ok) { showAlert(msgEl, data.error || 'Could not generate a reset link.', 'error'); return; }
    showAlert(msgEl, `This demo has no email service configured — use your reset link directly: <a href="${data.resetUrl}">Reset your password</a>`, 'success');
  } catch {
    showAlert(msgEl, 'Could not reach the server — is the backend running?', 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Send reset link';
  }
});
</script>

</body>
</html>
