<!DOCTYPE html>
<html lang="en">
<head>
<script src="js/access-gate.js?v=3"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>Parameter Reference · Vitarus</title>
<link rel="stylesheet" href="css/shared.css?v=13">
<link rel="stylesheet" href="css/redesign.css?v=5">
<style>
  body { overflow-y: auto; }
  .ref-layout { display: grid; grid-template-columns: 260px 1fr; height: calc(100vh - 57px); }

  /* Sidebar nav */
  .ref-nav { background: var(--surface); border-right: 1px solid var(--border);
    overflow-y: auto; padding: 12px 0; }
  .nav-section { padding: 6px 16px 4px; font-size: 10px; font-weight: 700;
    letter-spacing: .8px; text-transform: uppercase; color: var(--text-dim); }
  .nav-item { display: flex; align-items: center; gap: 8px; padding: 8px 16px;
    cursor: pointer; font-size: 13px; border-left: 3px solid transparent;
    transition: all .12s; }
  .nav-item:hover { background: var(--surface-2); }
  .nav-item.active { background: var(--surface-2); border-left-color: var(--blue-light);
    color: var(--blue-light); }
  .nav-sub { padding: 5px 16px 5px 36px; cursor: pointer; font-size: 12px;
    color: var(--text-muted); border-left: 3px solid transparent; transition: all .12s; }
  .nav-sub:hover { color: var(--text); background: var(--surface-2); }
  .nav-sub.active { color: var(--text); border-left-color: var(--accent); }

  /* Main content */
  .ref-content { overflow-y: auto; padding: 28px 36px; }

  .device-hero { display: flex; align-items: center; gap: 16px; margin-bottom: 24px;
    padding-bottom: 20px; border-bottom: 1px solid var(--border); }
  .device-hero-icon { font-size: 48px; }
  .device-hero h2 { font-size: 22px; font-weight: 700; }
  .device-hero .sub { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
  .protocol-badge { font-size: 11px; padding: 3px 10px; border-radius: 12px;
    border: 1px solid var(--border); color: var(--text-muted); margin-top: 6px; display:inline-block; }

  /* Section headings */
  .section-h { font-size: 14px; font-weight: 700; margin: 24px 0 12px;
    display: flex; align-items: center; gap: 8px; }
  .section-h::after { content:''; flex:1; height:1px; background:var(--border); }

  /* Parameter table */
  .param-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 12px; }
  .param-table th { text-align: left; padding: 7px 10px; background: var(--surface-2);
    border: 1px solid var(--border); color: var(--text-muted); font-weight: 600;
    font-size: 11px; text-transform: uppercase; letter-spacing: .4px; }
  .param-table td { padding: 8px 10px; border: 1px solid var(--border); vertical-align: top; }
  .param-table tr:hover td { background: var(--surface-2); }
  .param-key { font-family: var(--font-mono); color: #79c0ff; font-size: 12px; }
  .param-type { font-family: var(--font-mono); color: #ffa657; font-size: 11px; }
  .param-default { font-family: var(--font-mono); color: #7ee787; font-size: 11px; }
  .param-required { color: #ff7b72; font-size: 10px; font-weight: 700; }
  .param-optional { color: var(--text-dim); font-size: 10px; }

  /* Output schema */
  .schema-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 20px; }
  .schema-table th { text-align:left; padding: 7px 10px; background: var(--surface-2);
    border: 1px solid var(--border); color: var(--text-muted); font-size:11px;
    text-transform:uppercase; letter-spacing:.4px; }
  .schema-table td { padding: 7px 10px; border: 1px solid var(--border); vertical-align: top; }
  .schema-table tr:hover td { background: var(--surface-2); }
  .field-key  { font-family: var(--font-mono); color: #79c0ff; }
  .field-type { font-family: var(--font-mono); color: #ffa657; font-size: 11px; }
  .field-unit { color: #7ee787; font-size: 10px; }
  .nest-row td:first-child { padding-left: 28px; color: var(--text-muted); }

  /* Action block */
  .action-block { border: 1px solid var(--border); border-radius: 8px;
    overflow: hidden; margin-bottom: 20px; }
  .action-block-header { padding: 10px 14px; background: var(--surface-2);
    display: flex; align-items: center; gap: 10px; }
  .action-block-body { padding: 14px; }
  .action-key { font-family: var(--font-mono); font-size: 13px; font-weight: 700; }
  .stream-pill { background:#1a3a4f; color:#58a6ff; font-size:10px; padding:2px 8px;
    border-radius:10px; font-weight:700; }
  .request-pill { background:#1a2a1a; color:#7ee787; font-size:10px; padding:2px 8px;
    border-radius:10px; font-weight:700; }

  .example-box { background: var(--bg); border: 1px solid var(--border); border-radius:6px;
    padding: 12px 14px; font-family: var(--font-mono); font-size: 11px;
    line-height: 1.7; overflow-x: auto; white-space: pre; }
</style>
<link rel="stylesheet" href="css/redesign.css?v=5">
</head>
<body>

<header class="page-header">
  <a href="index.html" class="back-link">← All Devices</a>
  <h1>📋 Parameter Reference</h1>
  <a href="universal-fetcher.html" class="btn btn-blue" style="padding:6px 14px;font-size:12px;text-decoration:none;">🔄 Open Universal Fetcher</a>
</header>

<div class="ref-layout">
  <nav class="ref-nav" id="refNav"></nav>
  <main class="ref-content" id="refContent">
    <p class="text-muted">Select a device from the left panel.</p>
  </main>
</div>

<script src="js/utils.js"></script>
<script src="js/driver-base.js"></script>
<script src="js/param-registry.js"></script>
<script>

// ── Build sidebar nav ──────────────────────────────────────────────────────
function buildNav() {
  const nav = document.getElementById('refNav');
  nav.innerHTML = `<div class="nav-section">Devices</div>`;

  Object.entries(ParamRegistry).forEach(([key, def]) => {
    const item = document.createElement('div');
    item.className = 'nav-item';
    item.dataset.key = key;
    item.innerHTML = `<span>${def.icon}</span><span>${def.label}</span>`;
    item.onclick = () => showDevice(key);
    nav.appendChild(item);

    // Sub-items per action
    def.actions.forEach(action => {
      const sub = document.createElement('div');
      sub.className = 'nav-sub';
      sub.dataset.key = key;
      sub.dataset.action = action.key;
      sub.textContent = action.label;
      sub.onclick = (e) => { e.stopPropagation(); showDevice(key, action.key); };
      nav.appendChild(sub);
    });
  });
}

// ── Show device reference ──────────────────────────────────────────────────
function showDevice(deviceKey, scrollToAction) {
  const def = ParamRegistry[deviceKey];
  if (!def) return;

  // Update nav
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav-sub').forEach(el => el.classList.remove('active'));
  const navItem = document.querySelector(`.nav-item[data-key="${deviceKey}"]`);
  if (navItem) navItem.classList.add('active');
  if (scrollToAction) {
    const sub = document.querySelector(`.nav-sub[data-key="${deviceKey}"][data-action="${scrollToAction}"]`);
    if (sub) sub.classList.add('active');
  }

  // Render content
  const content = document.getElementById('refContent');
  content.innerHTML = buildDevicePage(deviceKey, def);

  // Scroll to action if requested
  if (scrollToAction) {
    const el = document.getElementById('action_' + scrollToAction);
    if (el) setTimeout(() => el.scrollIntoView({ behavior:'smooth', block:'start' }), 50);
  }
}

// ── Build device page HTML ─────────────────────────────────────────────────
function buildDevicePage(key, def) {
  return `
    <div class="device-hero">
      <div class="device-hero-icon">${def.icon}</div>
      <div>
        <h2>${def.label}</h2>
        <div class="sub">${def.category}</div>
        <div class="protocol-badge">🔌 ${def.protocol}</div>
      </div>
    </div>

    <div class="section-h">⚙️ Connection Parameters</div>
    ${buildConnParamTable(def.connectionParams)}

    <div class="section-h">🎬 Actions & Data Contracts</div>
    ${def.actions.map(a => buildActionBlock(a)).join('')}
  `;
}

// ── Connection parameter table ─────────────────────────────────────────────
function buildConnParamTable(params) {
  const rows = params.map(p => `
    <tr>
      <td><span class="param-key">${p.key}</span></td>
      <td><span class="param-type">${p.type}</span></td>
      <td><span class="param-default">${p.default ?? '—'}</span></td>
      <td>${p.type === 'select' ? `<code style="font-size:10px;">${p.options.join(' | ')}</code>` : ''}</td>
      <td>${p.desc || '—'}</td>
    </tr>`).join('');

  return `
    <table class="param-table">
      <thead><tr>
        <th>Key</th><th>Type</th><th>Default</th><th>Options</th><th>Description</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

// ── Action block ───────────────────────────────────────────────────────────
function buildActionBlock(action) {
  const pill = action.type === 'stream'
    ? `<span class="stream-pill">STREAM</span>`
    : `<span class="request-pill">REQUEST</span>`;

  const paramsTable = action.params?.length
    ? `<p style="font-size:12px;font-weight:600;margin:14px 0 6px;color:var(--text-muted);">INPUT PARAMETERS</p>
       <table class="param-table">
         <thead><tr><th>Key</th><th>Type</th><th>Default</th><th>Options</th><th>Description</th></tr></thead>
         <tbody>${action.params.map(p => `
           <tr>
             <td><span class="param-key">${p.key}</span></td>
             <td><span class="param-type">${p.type}</span></td>
             <td><span class="param-default">${p.default ?? '—'}</span></td>
             <td>${p.type === 'select' ? `<code style="font-size:10px;">${p.options.join(' | ')}</code>` : (p.min !== undefined ? `${p.min}–${p.max}` : '')}</td>
             <td>${p.desc || '—'}</td>
           </tr>`).join('')}
         </tbody>
       </table>`
    : `<p class="text-muted" style="font-size:12px;margin:10px 0;">No input parameters required.</p>`;

  const outputTable = buildOutputTable(action.output);

  const exampleOutput = buildExampleOutput(action.output);

  return `
    <div class="action-block" id="action_${action.key}">
      <div class="action-block-header">
        ${pill}
        <span class="action-key">${action.key}()</span>
        <span style="color:var(--text-muted);font-size:12px;">— ${action.desc}</span>
      </div>
      <div class="action-block-body">
        ${paramsTable}
        <p style="font-size:12px;font-weight:600;margin:14px 0 6px;color:var(--text-muted);">OUTPUT FIELDS</p>
        ${outputTable}
        <p style="font-size:12px;font-weight:600;margin:14px 0 6px;color:var(--text-muted);">EXAMPLE OUTPUT</p>
        <div class="example-box">${buildExampleHighlight(exampleOutput)}</div>
      </div>
    </div>`;
}

// ── Output field table ─────────────────────────────────────────────────────
function buildOutputTable(schema, prefix) {
  prefix = prefix || '';
  let rows = '';
  Object.entries(schema).forEach(([key, def]) => {
    if (key === '_desc') return;
    if (def.type) {
      rows += `<tr>
        <td class="field-key" style="padding-left:${prefix ? 24 : 8}px;">
          ${prefix ? '└ ' : ''}${key}
        </td>
        <td><span class="field-type">${def.type}</span>
          ${def.unit ? `<span class="field-unit"> [${def.unit}]</span>` : ''}</td>
        <td>${def.desc || '—'}</td>
      </tr>`;
    } else {
      rows += `<tr>
        <td class="field-key" style="padding-left:${prefix ? 24 : 8}px;font-style:italic;">
          ${prefix ? '└ ' : ''}${key} <span style="color:var(--text-dim);font-style:normal;">{ }</span>
        </td><td></td><td>${def._desc || ''}</td>
      </tr>`;
      rows += buildOutputTableRows(def, '  ');
    }
  });
  return `<table class="schema-table">
    <thead><tr><th>Field</th><th>Type / Unit</th><th>Description</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function buildOutputTableRows(schema, indent) {
  let rows = '';
  Object.entries(schema).forEach(([key, def]) => {
    if (key === '_desc') return;
    if (def.type) {
      rows += `<tr class="nest-row">
        <td style="padding-left:32px;">↳ ${key}</td>
        <td><span class="field-type">${def.type}</span>
          ${def.unit ? `<span class="field-unit"> [${def.unit}]</span>` : ''}</td>
        <td>${def.desc || '—'}</td>
      </tr>`;
    }
  });
  return rows;
}

// ── Example output generator ───────────────────────────────────────────────
function buildExampleOutput(schema) {
  const obj = {};
  Object.entries(schema).forEach(([key, def]) => {
    if (key === '_desc') return;
    if (def.type) {
      obj[key] = sampleValue(def);
    } else {
      const nested = {};
      Object.entries(def).forEach(([nk, nd]) => {
        if (nk !== '_desc' && nd.type) nested[nk] = sampleValue(nd);
      });
      obj[key] = nested;
    }
  });
  return obj;
}

function sampleValue(def) {
  if (def.type === 'integer') return def.unit === 'ms' ? 1721564400000 : def.unit === 'µs' ? 1721564400000000 : 42;
  if (def.type === 'float')   return def.unit === '°C' || def.unit === '°' ? 38.4 : 0.42;
  if (def.type === 'boolean') return true;
  if (def.type === 'string')  {
    if (def.desc && def.desc.includes('ISO')) return '2024-07-21T14:30:00.000Z';
    if (def.desc && def.desc.includes('|'))   return def.desc.split('|')[0].trim();
    return 'value';
  }
  if (def.type === 'array')   return ['item1', 'item2'];
  if (def.type === 'object')  return {};
  if (def.type.includes('null')) return null;
  return null;
}

function buildExampleHighlight(obj) {
  return JSON.stringify(obj, null, 2)
    .replace(/(".*?")\s*:/g, '<span style="color:#79c0ff">$1</span> :')
    .replace(/:\s*(".*?")/g, ': <span style="color:#a8ff78">$1</span>')
    .replace(/:\s*(true|false)/g, ': <span style="color:#ffaa44">$1</span>')
    .replace(/:\s*(null)/g, ': <span style="color:#ff7b72">$1</span>')
    .replace(/:\s*(\d+\.?\d*)/g, ': <span style="color:#a5d6ff">$1</span>');
}

// ── Init ───────────────────────────────────────────────────────────────────
buildNav();
// Show first device by default
showDevice(Object.keys(ParamRegistry)[0]);
</script>
</body>
</html>
