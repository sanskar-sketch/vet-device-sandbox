<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="js/access-gate.js?v=3"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>Reset password · Vitarus</title>
<link rel="stylesheet" href="css/shared.css?v=14">
<link rel="stylesheet" href="css/redesign.css?v=5">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
  .login-wrap { width: 100%; max-width: 380px; position: relative; isolation: isolate; }
  .login-wrap > .card {
    position: relative; overflow: hidden;
    background: rgba(23,69,107,.9) !important;
    border: 1px solid rgba(43,181,166,.28) !important;
    box-shadow: 0 18px 44px rgba(0,0,0,.34), 0 0 0 8px rgba(43,181,166,.05);
    backdrop-filter: blur(16px);
  }
  .login-wrap > .card::before {
    content: ""; position: absolute; inset: 0 0 auto; height: 4px;
    background: linear-gradient(90deg, var(--mod-cardiac), var(--mod-ultrasound), var(--brand-teal), var(--mod-gait));
  }
  .reset-title { font-size: 19px; font-weight: 700; color: var(--heading); margin: 0 0 4px; }
  .reset-sub { font-size: 12.5px; color: var(--text-muted); margin: 0 0 18px; }
  .login-form { display: flex; flex-direction: column; gap: 12px; }
  .login-alert {
    display: none; align-items: flex-start; gap: 8px; padding: 10px 12px;
    border-radius: var(--radius-sm); font-size: 12.5px; line-height: 1.5;
  }
  .login-alert.show { display: flex; }
  .login-alert.error { background: rgba(232,115,122,.12); border: 1px solid rgba(232,115,122,.4); color: var(--red); }
  .login-alert.success { background: rgba(43,181,166,.12); border: 1px solid rgba(43,181,166,.4); color: var(--brand-teal); }
  .login-alert .la-icon { flex-shrink: 0; }
  @keyframes loginShake {
    10%, 90% { transform: translateX(-1px); }
    20%, 80% { transform: translateX(2px); }
    30%, 50%, 70% { transform: translateX(-4px); }
    40%, 60% { transform: translateX(4px); }
  }
  .login-alert.error.show { animation: loginShake .4s; }
  .reset-sub a {
    color: var(--blue-light); font-weight: 600; text-decoration: none;
  }
  .reset-sub a:hover { color: var(--accent); text-decoration: underline; }
  .reset-sub a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .reset-logo { display: block; width: 190px; height: auto; margin: 0 auto 26px; }
</style>
<link rel="stylesheet" href="css/experience.css?v=5">
</head>
<body>

<div class="login-wrap">
  <!-- This page had no brand mark at all; it's reached from an emailed link,
       so showing the logo is what tells someone the page is genuinely ours. -->
  <img class="reset-logo" src="assets/brand/vitarus-lockup-light.svg" alt="Vitarus — Animal Diagnostics">
  <div class="card">
    <div class="card-body">
      <div class="reset-title">Set a new password</div>
      <p class="reset-sub" id="reset-context">Choose a new password for your account.</p>

      <form class="login-form" id="form-reset">
        <div class="form-group">
          <label>New password (min. 8 characters)</label>
          <input type="password" id="reset-password" required minlength="8" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label>Confirm new password</label>
          <input type="password" id="reset-password-confirm" required minlength="8" autocomplete="new-password">
        </div>
        <div class="login-alert" id="reset-message"></div>
        <button type="submit" class="btn btn-primary btn-full" id="btn-reset-submit">Update password</button>
      </form>

      <p class="reset-sub" style="margin-top:16px;margin-bottom:0;"><a href="/login.html">← Back to sign in</a></p>
    </div>
  </div>
</div>

<script>
function showAlert(el, message, type) {
  el.classList.remove('show');
  void el.offsetWidth;
  el.className = 'login-alert' + (type ? ' ' + type : '');
  el.innerHTML = message ? `<span class="la-icon">${type === 'success' ? '✓' : '⚠️'}</span><span>${message}</span>` : '';
  if (message) el.classList.add('show');
}

const token = new URLSearchParams(location.search).get('token');
const form = document.getElementById('form-reset');
if (!token) {
  document.getElementById('reset-context').textContent = 'This reset link is missing its token — request a new one from the sign-in page.';
  form.style.display = 'none';
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const msgEl = document.getElementById('reset-message');
  const pw = document.getElementById('reset-password').value;
  const pwConfirm = document.getElementById('reset-password-confirm').value;
  if (pw !== pwConfirm) { showAlert(msgEl, 'Passwords do not match.', 'error'); return; }

  const btn = document.getElementById('btn-reset-submit');
  btn.disabled = true;
  btn.textContent = 'Updating…';
  try {
    const res = await fetch('/api/auth/reset-password', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin',
      body: JSON.stringify({ token, password: pw })
    });
    const data = await res.json();
    if (!res.ok) {
      showAlert(msgEl, data.error || 'Could not reset password.', 'error');
      btn.disabled = false;
      btn.textContent = 'Update password';
      return;
    }
    showAlert(msgEl, 'Password updated — redirecting you to sign in…', 'success');
    form.querySelectorAll('input, button').forEach(el => el.disabled = true);
    setTimeout(() => { location.href = '/login.html'; }, 1800);
  } catch {
    showAlert(msgEl, 'Could not reach the server — is the backend running?', 'error');
    btn.disabled = false;
    btn.textContent = 'Update password';
  }
});
</script>

</body>
</html>
