<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 52" width="220" height="52" role="img" aria-label="Vitarus">
  <!-- Wordmark only (no descriptor line) — for tight spots like app headers,
       where "ANIMAL DIAGNOSTICS" would render too small to read. Text is set
       in Helvetica/Arial rather than an embedded font: the two are metrically
       compatible on every platform this ships to, so the lockup's proportions
       (and the teal rule's alignment under the "A") hold everywhere. -->
  <text x="1" y="38" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="46" font-weight="700" letter-spacing="2.5" fill="#123A5C">VITARUS</text>
  <rect x="77" y="44" width="31.9" height="5.5" rx="1" fill="#2BB5A6"/>
</svg>
